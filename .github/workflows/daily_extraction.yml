name: SEC Daily Extraction Pipeline

on:
  schedule:
    # Runs automatically at 8:00 AM UTC every weekday
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # Allows you to click a "Run" button manually in GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Extraction Engine
        env:
          # Pulls the secret securely from GitHub's vault
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }} 
        run: |
          python -m sec_keyterms.run
          python benchmark_report.py

      - name: Upload JSON Output
        uses: actions/upload-artifact@v4
        with:
          name: sec-extracted-data
          path: output/*.json
          retention-days: 7