name: Daily Key Terms Extraction

on:
  schedule:
    # 11:00 UTC = 06:00/07:00 ET, after EDGAR's daily index for the prior
    # business day is fully settled (EDGAR accepts filings until 22:00 ET).
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Filing date YYYY-MM-DD (blank = previous business day)"
        required: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python -m sec_keyterms.run --date "${{ github.event.inputs.date }}" --out output/
          else
            python -m sec_keyterms.run --out output/
          fi
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: key-terms-${{ github.run_id }}
          path: output/
          retention-days: 30
